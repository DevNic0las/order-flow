name: Deploy Payment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR: orderflownicolas.azurecr.io
  IMAGE_NAME: payment-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: |
          az acr login --name orderflownicolas

      - name: Build da imagem
        run: |
          docker build \
            -f payment-service/Dockerfile \
            -t $ACR/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push da imagem
        run: |
          docker push \
            $ACR/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy no Container App
        run: |
          az containerapp update \
            --resource-group rg-order-flow \
            --name payment \
            --image $ACR/$IMAGE_NAME:${{ github.sha }}