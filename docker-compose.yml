version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # cria schemas separados

  order-service:
    build:
      context: .
      dockerfile: order/Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_ADDRESSES: amqp://guest:guest@rabbitmq:5672
      SPRING_RABBITMQ_SSL_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=orders
      DATABASE_USER: orderflow
      DATABASE_PASSWORD: orderflow
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: inventory/Dockerfile
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_ADDRESSES: amqp://guest:guest@rabbitmq:5672
      SPRING_RABBITMQ_SSL_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=inventory
      DATABASE_USER: orderflow
      DATABASE_PASSWORD: orderflow
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification/Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_ADDRESSES: amqp://guest:guest@rabbitmq:5672
      SPRING_RABBITMQ_SSL_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=notification
      DATABASE_USER: orderflow
      DATABASE_PASSWORD: orderflow
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@orderflow.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-orderflow}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_ADDRESSES: amqp://guest:guest@rabbitmq:5672
      SPRING_RABBITMQ_SSL_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=users
      DATABASE_USER: orderflow
      DATABASE_PASSWORD: orderflow
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: orderflow-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - order-service
      - inventory-service
      - notification-service
      - auth-service

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: orderflow-web
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_BASE_URL: http://gateway:8080
    depends_on:
      - gateway

  mailpit:
    image: axllent/mailpit:latest
    container_name: orderflow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
  grafana_data:
