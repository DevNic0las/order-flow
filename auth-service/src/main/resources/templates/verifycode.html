
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificar e-mail</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f5f7;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 26px;
        }

        .description {
            margin-bottom: 8px;
            color: #666;
            line-height: 1.5;
        }

        .email {
            margin-bottom: 25px;
            font-weight: bold;
            word-break: break-word;
        }

        .code-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
        }

        .code-input:focus {
            outline: none;
            border-color: #555;
        }

        .code-input:invalid:not(:placeholder-shown) {
            border-color: #b00020;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #b00020;
        }

        .message.success {
            display: block;
            background: #e5f7e5;
            color: #176b17;
        }

        .resend {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .resend a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .resend a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Verifique seu e-mail</h1>

    <p class="description">
        Enviamos um código de 6 dígitos para:
    </p>

    <p class="email" th:text="${email}">
        seu@email.com
    </p>

    <!--
        O token identifica a tentativa de verificação.
        Ele NÃO é o código enviado por e-mail.
    -->
    <input
            type="hidden"
            id="verificationToken"
            th:value="${verificationToken}"
    >

    <div
            id="message"
            class="message"
            role="alert">
    </div>

    <form id="verifyForm">

        <input
                id="code"
                class="code-input"
                type="text"
                name="code"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                autocomplete="one-time-code"
                required
                aria-label="Código de verificação"
        >

        <button
                id="verifyButton"
                type="submit">
            Verificar
        </button>

    </form>

    <p class="resend">
        Não recebeu o código?
        <a href="#" id="resendLink">Enviar novamente</a>
    </p>

</div>

<script>
    const form = document.getElementById("verifyForm");
    const codeInput = document.getElementById("code");
    const tokenInput = document.getElementById("verificationToken");
    const verifyButton = document.getElementById("verifyButton");
    const resendLink = document.getElementById("resendLink");
    const message = document.getElementById("message");

    resendLink.addEventListener("click", async (event) => {
        event.preventDefault();
        const token = tokenInput.value;
        console.log(token)
        if (!token) {
            showError("Token de verificação não encontrado.");
            return;
        }

        clearMessage();
        resendLink.textContent = "Enviando...";
        resendLink.style.pointerEvents = "none";

        try {
            const response = await fetch("/auth/resend-code", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ token: token })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showError(data.message || "Não foi possível reenviar o código.");
                return;
            }

            if (data.token) {
                tokenInput.value = data.token;
            }

            showSuccess("Novo código enviado para o seu e-mail.");
        } catch (error) {
            console.error(error);
            showError("Não foi possível reenviar o código.");
        } finally {
            resendLink.textContent = "Enviar novamente";
            resendLink.style.pointerEvents = "auto";
        }
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        clearMessage();

        const code = codeInput.value.trim();
        const token = tokenInput.value;

        if (!/^\d{6}$/.test(code)) {
            showError("Digite um código válido de 6 dígitos.");
            return;
        }

        if (!token) {
            showError("Token de verificação não encontrado.");
            return;
        }

        setLoading(true);

        try {
            const response = await fetch("/auth/verifycode", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    code: code
                })
            });

            const data = await response.json();
            console.log(data)
            if (!response.ok) {
                showError(data.message || "Não foi possível verificar o código.");
                return;
            }

            showSuccess("E-mail verificado com sucesso!");

            localStorage.setItem("token", data.token);

            window.location.href = "/home";
        } catch (error) {
            console.error(error);
            showError("Não foi possível conectar ao servidor.");
        } finally {
            setLoading(false);
        }
    });

    function setLoading(loading) {
        verifyButton.disabled = loading;
        verifyButton.textContent = loading
            ? "Verificando..."
            : "Verificar";
    }

    function showError(text) {
        message.textContent = text;
        message.className = "message error";
    }

    function showSuccess(text) {
        message.textContent = text;
        message.className = "message success";
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }
</script>

</body>
</html>
