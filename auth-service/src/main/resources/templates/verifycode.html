<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ```
    <title>Verificar e-mail</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f5f7;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 26px;
        }

        .description {
            margin-bottom: 8px;
            color: #666;
            line-height: 1.5;
        }

        .email {
            margin-bottom: 25px;
            font-weight: bold;
        }

        .code-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
        }

        .code-input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .error {
            margin-bottom: 18px;
            padding: 10px;
            border-radius: 6px;
            background: #ffe5e5;
            color: #b00020;
            font-size: 14px;
        }

        .resend {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .resend a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <h1>Verifique seu e-mail</h1>

    <p class="description">
        Enviamos um código de 6 dígitos para:
    </p>

    <p class="email" th:text="${email}">
        a@a.com
    </p>

    <div class="error" th:if="${error}" th:text="${error}">
        Código inválido.
    </div>

    <form method="post" action="/auth/verifycode">

        <input
                class="code-input"
                type="text"
                name="code"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                autocomplete="one-time-code"
                required
        >

        <button type="submit">
            Verificar
        </button>

    </form>

    <p class="resend">
        Não recebeu o código?
        <a href="/auth/resend-code">Enviar novamente</a>
    </p>
    ```

</div>

</body>
</html>
