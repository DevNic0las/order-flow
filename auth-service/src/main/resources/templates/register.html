<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background: #f4f5f7;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 400px;

            padding: 32px;

            background: #fff;
            border-radius: 12px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 26px;
        }

        .description {
            margin-bottom: 28px;
            text-align: center;
            color: #666;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #222;
            color: #fff;

            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-bottom: 18px;
            padding: 10px;

            border-radius: 6px;

            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #b00020;
        }

        .message.success {
            display: block;
            background: #e5f7e5;
            color: #176b17;
        }

        .login {
            margin-top: 20px;

            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .login a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Criar conta</h1>

    <p class="description">
        Crie sua conta para começar.
    </p>

    <div id="message" class="message" role="alert"></div>

    <form id="registerForm">

        <div class="field">
            <label for="username">Nome de usuário</label>

            <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Seu nome"
                    autocomplete="username"
                    required
            >
        </div>

        <div class="field">
            <label for="email">E-mail</label>

            <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
            >
        </div>

        <div class="field">
            <label for="password">Senha</label>

            <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Sua senha"
                    autocomplete="new-password"
                    required
            >
        </div>

        <button id="registerButton" type="submit">
            Criar conta
        </button>

    </form>

    <p class="login">
        Já possui uma conta?
        <a href="/login">Entrar</a>
    </p>

</div>

<script>

    const form = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        clearMessage();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !email || !password) {
            showError("Preencha todos os campos.");
            return;
        }

        setLoading(true);

        try {

            const response = await fetch("/auth/register", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                showError(
                    data.message || "Não foi possível criar sua conta."
                );
                return;
            }

            /*
             * O backend retorna o token de verificação.
             *
             * Não mostramos o código aqui.
             * O código deve chegar pelo e-mail.
             */

            window.location.href =
                "/auth/verifycode/email?token=" + encodeURIComponent(data.token);

        } catch (error) {

            console.error(error);

            showError(
                "Não foi possível conectar ao servidor."
            );

        } finally {

            setLoading(false);
        }
    });


    function setLoading(loading) {

        registerButton.disabled = loading;

        registerButton.textContent =
            loading ? "Criando conta..." : "Criar conta";
    }


    function showError(text) {

        message.textContent = text;
        message.className = "message error";
    }


    function showSuccess(text) {

        message.textContent = text;
        message.className = "message success";
    }


    function clearMessage() {

        message.textContent = "";
        message.className = "message";
    }

</script>

</body>
</html>
