spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow?currentSchema=users
    username: orderflow
    password: orderflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users
    show-sql: false

  flyway:
    schemas:
      - users
      - email_verification
    default-schema: users
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

jwt:
  secret: ${JWT_SECRET}
  duration: 3600000


logging:
  level:
    org.springframework.security: TRACE