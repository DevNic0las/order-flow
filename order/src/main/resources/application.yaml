spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow?currentSchema=orders
    username: orderflow
    password: orderflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
    show-sql: false

  flyway:
    schemas: orders
    default-schema: orders
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: order-service