spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  rabbitmq:
    addresses: ${RABBITMQ_URL}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 20000
          multiplier: 2.0
          max-interval: 100000
        default-requeue-rejected: true
    ssl:
      enabled: true

brevo:
    api-key: ${BREVO_API_KEY}
    sender-email: ${BREVO_SENDER_EMAIL}
    sender-name: ${BREVO_SENDER_NAME}
    base-url: ${BREVO_API_URL}